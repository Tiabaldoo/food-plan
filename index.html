<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f7f5" />
  <title>Наше меню</title>
  <link rel="stylesheet" href="css/style.css?v=32" />
  <link rel="stylesheet" href="css/eaten.css?v=32" />
  <link rel="stylesheet" href="css/date-history.css?v=32" />
  <link rel="stylesheet" href="css/manual-food.css?v=32" />
  <link rel="stylesheet" href="css/navigation.css?v=32" />
  <link rel="stylesheet" href="css/calendar.css?v=32" />
  <link rel="stylesheet" href="css/profile.css?v=32" />
  <link rel="stylesheet" href="css/profile-mobile-fix.css?v=32" />
  <link rel="stylesheet" href="css/day-target.css?v=32" />
  <link rel="stylesheet" href="css/recipes-library.css?v=32" />
  <link rel="stylesheet" href="css/products-library.css?v=32" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <p class="eyebrow">План питания</p>
      <h1 id="pageTitle">Наше меню</h1>
    </div>

    <nav class="desktop-nav" aria-label="Основная навигация">
      <button class="nav-btn active" data-section-target="menu"><span class="nav-icon">🍽</span><span>Меню</span></button>
      <button class="nav-btn" data-section-target="calendar"><span class="nav-icon">📅</span><span>Календарь</span></button>
      <button class="nav-btn" data-section-target="recipes"><span class="nav-icon">📖</span><span>Блюда</span></button>
      <button class="nav-btn" data-section-target="shopping"><span class="nav-icon">🛒</span><span>Покупки</span></button>
      <button class="nav-btn" data-section-target="profile"><span class="nav-icon">👥</span><span>Мы</span></button>
    </nav>

    <div class="view-switch menu-view-switch" role="group" aria-label="Режим просмотра меню">
      <button class="view-btn active" data-view="today">Сегодня</button>
      <button class="view-btn" data-view="week">Неделя</button>
    </div>
  </header>

  <main class="page-shell">
    <section class="section-view" data-section-view="menu">
      <section id="menuContainer" class="menu-container" aria-live="polite"></section>
    </section>

    <section class="section-view calendar-section" data-section-view="calendar" hidden>
      <div id="calendarRoot"></div>
    </section>

    <section class="section-view recipes-section" data-section-view="recipes" hidden>
      <div class="dishes-subnav" data-dishes-subnav>
        <button type="button" class="active" data-dishes-view="recipes">Рецепты</button>
        <button type="button" data-dishes-view="products">Продукты</button>
      </div>
      <div id="recipesRoot"></div>
      <div id="productsRoot" hidden></div>
    </section>

    <section class="section-view placeholder-section" data-section-view="shopping" hidden>
      <div class="placeholder-card"><span class="placeholder-badge">В разработке</span><h2>Покупки</h2><p>Здесь появится общий список продуктов, автоматически рассчитанный по выбранному меню на двоих.</p></div>
    </section>

    <section class="section-view profile-section" data-section-view="profile" hidden>
      <div id="profileRoot"></div>
    </section>
  </main>

  <nav class="mobile-nav" aria-label="Основная навигация">
    <button class="nav-btn active" data-section-target="menu"><span class="nav-icon">🍽</span><span>Меню</span></button>
    <button class="nav-btn" data-section-target="calendar"><span class="nav-icon">📅</span><span>Календарь</span></button>
    <button class="nav-btn" data-section-target="recipes"><span class="nav-icon">📖</span><span>Блюда</span></button>
    <button class="nav-btn" data-section-target="shopping"><span class="nav-icon">🛒</span><span>Покупки</span></button>
    <button class="nav-btn" data-section-target="profile"><span class="nav-icon">👥</span><span>Мы</span></button>
  </nav>

  <div id="recipeModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <article class="modal-card" role="dialog" aria-modal="true" aria-labelledby="recipeTitle">
      <button class="modal-close" data-close-modal aria-label="Закрыть">×</button>
      <div id="recipeContent"></div>
    </article>
  </div>

  <div id="replaceModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-replace></div>
    <article class="modal-card replace-modal-card" role="dialog" aria-modal="true" aria-labelledby="replaceTitle">
      <button class="modal-close" data-close-replace aria-label="Закрыть">×</button>
      <div id="replaceContent"></div>
    </article>
  </div>

  <div id="alcoholModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-alcohol></div>
    <article class="modal-card alcohol-modal-card" role="dialog" aria-modal="true" aria-labelledby="alcoholTitle">
      <button class="modal-close" data-close-alcohol aria-label="Закрыть">×</button>
      <div id="alcoholContent"></div>
    </article>
  </div>

  <div id="manualFoodModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-manual></div>
    <article class="modal-card alcohol-modal-card" role="dialog" aria-modal="true" aria-labelledby="manualFoodTitle">
      <button class="modal-close" data-close-manual aria-label="Закрыть">×</button>
      <div id="manualFoodContent"></div>
    </article>
  </div>

  <script src="data/recipes.js?v=32"></script>
  <script src="js/product-model.js?v=32"></script>
  <script src="js/recipe-model.js?v=32"></script>
  <script src="js/recipe-product-links.js?v=32"></script>
  <script src="data/profiles.js?v=32"></script>
  <script src="js/storage.js?v=32"></script>
  <script src="js/menu.js?v=32"></script>
  <script src="js/app.js?v=32"></script>
  <script src="js/manual-food.js?v=32"></script>
  <script src="js/calendar.js?v=32"></script>
  <script src="js/profile-target-sync.js?v=32"></script>
  <script src="js/profile.js?v=32"></script>
  <script src="js/day-target.js?v=32"></script>
  <script src="js/recipes-library.js?v=32"></script>
  <script src="js/products-library.js?v=32"></script>
  <script src="js/dishes-subnav.js?v=32"></script>
  <script src="js/recipe-ingredient-products.js?v=32"></script>
  <script src="js/navigation.js?v=32"></script>
</body>
</html>
